	function formatDate(strDate) {
		var dateParts = strDate.split("/");
		var date = new Date(dateParts[2], (dateParts[1] - 1), dateParts[0]);
		return Date.parse(date);
	}
	
	function replaceAll(str, find, replace) {
		var tt = str.split(find);
		for(var i=1; i<tt.length; i++){
			str = str.replace(find, replace);
		}
		return str;
	}

	function traCuuChungTu() {
		var DF_DDMMYYYY = "dd/MM/yyyy";
		var tuNgayLap = document.getElementById("ngay_lap_tu_ngay").value;
		var tuNgayGui = document.getElementById("ngay_gui_tu_ngay").value;
		var tuNgayNop = document.getElementById("ngay_nop_tu_ngay").value;
		var denNgayLap = document.getElementById("ngay_lap_den_ngay").value;
		var denNgayGui = document.getElementById("ngay_gui_den_ngay").value;
		var denNgayNop = document.getElementById("ngay_nop_den_ngay").value;

		var jTuNgayLap = formatDate(tuNgayLap);
		var jTuNgayGui = formatDate(tuNgayGui);
		var jTuNgayNop = formatDate(tuNgayNop);
		var jDenNgayGui = formatDate(denNgayGui);
		var jDenNgayLap = formatDate(denNgayLap);
		var jDenNgayNop = formatDate(denNgayNop);
		var timeInMs = new Date().getTime();
		
		var ma_gd = document.getElementById("ma_giao_dich").value;
		
		var tong_tien_nt_tu = document.getElementById("tong_tien_nt_tu").value;
		var tong_tien_nt_den = document.getElementById("tong_tien_nt_den").value;
		var tong_tien_tu = replaceAll(tong_tien_nt_tu, '.', '').replace(',', '.');
		var tong_tien_den = replaceAll(tong_tien_nt_den, '.', '').replace(',', '.');
		
		if($("#chk1").prop('checked')){
			if (tuNgayLap == '' && $.trim(ma_gd) == '') {
				alert("Từ ngày lập bắt buộc phải nhập!");
				document.getElementById("ngay_lap_tu_ngay").focus();
				return;
			}
			if ((tuNgayLap != '' && denNgayLap == '') || (tuNgayLap == '' && denNgayLap != '')
				|| (tuNgayGui != '' && denNgayGui == '') || (tuNgayGui == '' && denNgayGui != '')
				|| (tuNgayNop != '' && denNgayNop == '') || (tuNgayNop == '' && denNgayNop != '')) {
				alert("Bắt buộc nhập đầy đủ thông tin từ ngày, đến ngày!");
				return;
			}
			if (tuNgayLap != '' && denNgayLap != '' && compareDates(tuNgayLap, DF_DDMMYYYY, denNgayLap, DF_DDMMYYYY) == 1) {
				alert("Từ ngày lập phải nhỏ hơn hoặc bằng đến ngày lập");
				document.getElementById("ngay_lap_tu_ngay").focus();
				return;
			}
			if (jTuNgayLap > timeInMs) {
				alert("Từ ngày lập không được lớn hơn ngày hiện tại.");
				$(ngay_lap_tu_ngay).focus();
				return;
			}
			if (jDenNgayLap > timeInMs) {
				alert("Đến ngày lập không được lớn hơn ngày hiện tại.");
				$(ngay_lap_den_ngay).focus();
				return;
			}
			if (tuNgayGui != '' && denNgayGui != '' && compareDates(tuNgayGui, DF_DDMMYYYY, denNgayGui, DF_DDMMYYYY) == 1) {
				alert("Từ ngày gửi phải nhỏ hơn hoặc bằng đến ngày gửi");
				document.getElementById("ngay_gui_tu_ngay").focus();
				return;
			}
			if (jTuNgayGui > timeInMs) {
				alert("Từ ngày gửi không được lớn hơn ngày hiện tại.");
				$(ngay_gui_tu_ngay).focus();
				return;
			}
			if (jDenNgayGui > timeInMs) {
				alert("Đến ngày gửi không được lớn hơn ngày hiện tại.");
				$(ngay_gui_den_ngay).focus();
				return;
			}
			if (tuNgayLap != '' && denNgayLap != '' && !CompareYear(tuNgayLap, denNgayLap)){
				alert('Đến ngày lập không được vượt quá khoảng cách 12 tháng so với Từ ngày lập.');
				$(ngay_lap_den_ngay).focus();
				return;
			} 
			if (tuNgayGui != '' && denNgayGui != '' && !CompareYear(tuNgayGui, denNgayGui)){
				alert('Đến ngày gửi không được vượt quá khoảng cách 12 tháng so với Từ ngày gửi.');
				$(ngay_gui_den_ngay).focus();
				return;
			} 
		}else if($("#chk2").prop('checked')){
			if (tuNgayNop == '') {
				alert("Từ ngày nộp bắt buộc phải nhập!");
				document.getElementById("ngay_nop_tu_ngay").focus();
				return;
			}
			if ((tuNgayNop != '' && denNgayNop == '') || (tuNgayNop == '' && denNgayNop != '')) {
				alert("Bắt buộc nhập đầy đủ thông tin từ ngày, đến ngày!");
				return;
			}

		if (tuNgayNop != '' && denNgayNop != '' && compareDates(tuNgayNop, DF_DDMMYYYY, denNgayNop, DF_DDMMYYYY) == 1) {
			alert("Từ ngày nộp phải nhỏ hơn hoặc bằng đến ngày nộp");

			return;

			$(ngay_gui_tu_ngay).focus();

			return;
		}
		document.getElementById("reportForm").dse_nextEventName.value = 'query';
		document.getElementById("reportForm").submit();
	}
	
	function CompareYear(dtStr1, dtStr2){
		var bReturn = true;
		var startYear = dtStr1.substring(6);
		var endYear = dtStr2.substring(6);
		var startMonth = dtStr1.substring(3, 5);
		var endMonth = dtStr2.substring(3, 5);
		var startDay = dtStr1.substring(0, 2);
		var endDay = dtStr2.substring(0, 2);
		var newStartDate = startYear + startMonth + startDay;
		var newEndDate = endYear + endMonth + endDay;
		var check = Number(newEndDate) -  Number(newStartDate);
		if(dtStr1 != null && dtStr1 != "" && dtStr2 != null && dtStr2 != "") {
			if (Number(check) > 10000) {
				bReturn = false;
			}
		}
	    return bReturn;	
	}

	function numbersonly(myfield, e, dec) {
		var key;
		var keychar;
		if (window.event)
			key = window.event.keyCode;
		else if (e)
			key = e.which;
		else
			return true;
		keychar = String.fromCharCode(key);
		if ((key == null) || (key == 0) || (key == 8) || (key == 9)
				|| (key == 13) || (key == 27))
			return true;
		else if ((("0123456789-").indexOf(keychar) > -1))
			return true;
		else if (dec && (keychar == ".")) {
			myfield.form.elements[dec].focus();
			return false;
		} else
			return false;
	}
